name: Daily Instagram Reel

on:
  schedule:
    - cron: "30 17 * * *"
  workflow_dispatch:

jobs:
  create-reel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Reel Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +e

          for attempt in 1 2 3 4 5
          do
            echo "========================================"
            echo "AI Reel Agent attempt $attempt of 5"
            echo "========================================"

            python main.py

            STATUS=$?

            if [ "$STATUS" -eq 0 ]; then
              echo "AI Reel Agent completed successfully."
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              WAIT=$((attempt * 15))
              echo "Agent failed with exit code $STATUS."
              echo "Waiting ${WAIT} seconds before retry..."
              sleep "$WAIT"
            else
              echo "AI Reel Agent failed after 5 attempts."
              exit "$STATUS"
            fi
          done
