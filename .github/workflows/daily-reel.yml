name: Daily Instagram Reel

on:
  schedule:
    - cron: "30 17 * * *"
  workflow_dispatch:

jobs:
  create-reel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests moviepy pillow

      - name: Run AI Reel Agent
        run: |
          python main.py
