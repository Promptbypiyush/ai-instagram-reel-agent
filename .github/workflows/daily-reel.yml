name: Daily Instagram Reel

on:
  schedule:
    - cron: "30 17 * * *"
  workflow_dispatch:

jobs:
  create-reel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Check Instagram Configuration
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: |
          if [ -z "$INSTAGRAM_ACCESS_TOKEN" ]; then
            echo "ERROR: INSTAGRAM_ACCESS_TOKEN secret is missing."
            exit 1
          fi

          if [ -z "$INSTAGRAM_USER_ID" ]; then
            echo "ERROR: INSTAGRAM_USER_ID secret is missing."
            exit 1
          fi

          echo "Instagram credentials are loaded."

      - name: Run Reel Agent with Automatic Retry
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: |
          for i in 1 2 3 4; do
            python main.py && exit 0
            echo "Attempt $i failed. Retrying..."
            sleep $((i * 30))
          done

          exit 1
